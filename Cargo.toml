[workspace]
members = ["crates/reed-core", "crates/reed-protocol", "crates/reed-runtime"]
default-members = ["crates/reed-core", "crates/reed-protocol", "crates/reed-runtime"]
exclude = ["apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Zack-Zz/reed"
publish = false

[workspace.dependencies]
reed-core = { path = "crates/reed-core" }
reed-protocol = { path = "crates/reed-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "=0.8.9"
clap = { version = "=4.6.7", features = ["derive"] }
ts-rs = "=12.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
